<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Color Studio</title>
<style>
:root{--bg:#f4f3f0;--panel:#ffffff;--ink:#1f1f1d;--mute:#6f6b64;--line:#e3e0da;--soft:#f0eee9;--accent:#2e6b5c;--accent-ink:#ffffff;--ring:#2e6b5c}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--panel:#21211f;--ink:#f0eee9;--mute:#9d988f;--line:#383733;--soft:#2a2a27;--accent:#6fb8a2;--accent-ink:#10231d;--ring:#6fb8a2}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--mute)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{border-color:transparent;background:none;color:var(--mute);padding:4px 8px}
button.ghost:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
input[type=text],input[type=search],select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px 4px}
.top h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:20px;padding:12px 20px 28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}

.stage{position:sticky;top:10px}
@media(max-width:900px){.stage{position:static}}
.canvaswrap{position:relative;border-radius:12px;overflow:hidden;background:#111;line-height:0}
canvas#view{width:100%;height:auto;display:block}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;line-height:1.4}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--mute);font-size:13px}
.summary b{color:var(--ink);font-weight:600}
.summary i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h2{margin:0 0 10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;align-items:center}

.surfaces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.surf{display:flex;align-items:center;gap:9px;text-align:left;padding:8px 10px;border-width:2px;min-width:0}
.surf.active{border-color:var(--accent)}
.surf .sw{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.surf .sw.orig{background:repeating-linear-gradient(45deg,#d9d9d9 0 4px,#fff 4px 8px)}
.surf .t{min-width:0}
.surf .t b{display:block;font-size:13px}
.surf .t span{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.filters{display:flex;gap:8px;margin-bottom:8px}
.filters input{flex:1}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:3px 10px;border-radius:99px;font-size:12px;background:var(--soft);border-color:transparent}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:360px;overflow:auto;padding:2px}
.cw{position:relative}
.sw-btn{width:100%;padding:0;overflow:hidden;text-align:left;border-width:2px;border-radius:9px}
.sw-btn i{display:block;height:42px}
.sw-btn span{display:block;padding:4px 6px 5px;font-size:11px;line-height:1.2}
.sw-btn span em{display:block;font-style:normal;color:var(--mute);font-size:10px}
.sw-btn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cw .rm{position:absolute;top:3px;right:3px;width:18px;height:18px;padding:0;line-height:1;font-size:10px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;opacity:0}
.cw:hover .rm,.cw .rm:focus{opacity:1}
@media(hover:none){.cw .rm{opacity:.85}}
.empty{grid-column:1/-1;color:var(--mute);text-align:center;padding:18px 8px}
.count{font-size:12px;color:var(--mute);margin-top:8px}

details.add summary{cursor:pointer;font-weight:600;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add summary::before{content:"+ ";color:var(--accent)}
details.add[open] summary::before{content:"– "}
.addbody{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:140px}
.hint{font-size:12px;color:var(--mute);margin:0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
#chipWrap{display:none}
#chipCanvas{max-width:100%;max-height:180px;border-radius:8px;cursor:crosshair;border:1px solid var(--line)}
input[type=color]{width:42px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}

#history{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:420px;overflow:auto;padding:2px}
.h{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.h.cur{border-color:var(--accent)}
.h img{display:block;width:100%;height:84px;object-fit:cover;cursor:pointer}
.h .meta{padding:6px 7px}
.h .nm{width:100%;border:0;background:transparent;font-weight:600;font-size:12.5px;padding:0}
.h .dots{display:flex;gap:3px;margin:4px 0}
.h .dots i{flex:1;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.18)}
.h .acts{display:flex;justify-content:space-between}
.h .acts button{border:0;background:none;padding:2px 6px;font-size:15px;line-height:1}
.h .star.on{color:#e0a100}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 10px;font-size:12px;text-transform:none;letter-spacing:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="top">
  <h1>House Color Studio</h1>
  <div class="actions">
    <button class="primary" id="saveHist">Save to history</button>
    <button id="cmp" title="Press and hold">Hold to compare</button>
    <button id="dl">Download image</button>
  </div>
</div>

<main>
  <div class="stage">
    <div class="canvaswrap">
      <canvas id="view"></canvas>
      <div class="badge" id="badge" hidden>Original</div>
    </div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="panel">
    <div class="sec">
      <h2>Surface <button class="ghost" id="resetAll">Reset all</button></h2>
      <div class="surfaces" id="surfaces"></div>
    </div>

    <div class="sec">
      <h2>Color for <span id="activeName" style="color:var(--ink)"></span> <button class="ghost" id="origBtn">Use original</button></h2>
      <div class="filters">
        <input type="search" id="q" placeholder="Search by name or number" aria-label="Search colors">
        <select id="sort" aria-label="Sort colors">
          <option value="light">Light → dark</option>
          <option value="name">Name</option>
          <option value="num">Number</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <div class="count" id="count"></div>
    </div>

    <div class="sec">
      <details class="add">
        <summary>Add your own color</summary>
        <div class="addbody">
          <div class="row">
            <input type="text" id="urlIn" placeholder="Paint page URL, image link, or hex (#8A9A86)" aria-label="Color source">
            <input type="text" id="nameIn" placeholder="Name (optional)" style="max-width:150px" aria-label="Color name">
            <button class="primary" id="addBtn">Add</button>
          </div>
          <div class="row">
            <input type="color" id="picker" value="#8a9a86" aria-label="Pick a color">
            <button id="addCur">Add picked color</button>
            <button id="restorePal">Restore removed colors</button>
          </div>
          <label class="drop" id="drop">Or drop a paint chip photo here, or click to browse<input type="file" id="file" accept="image/*" hidden></label>
          <div id="chipWrap"><canvas id="chipCanvas"></canvas><p class="hint">Click the image to sample a color for the selected surface.</p></div>
          <p class="hint" id="addStatus"></p>
        </div>
      </details>
    </div>

    <div class="sec">
      <h2>Saved looks
        <span class="seg"><button id="fAll" class="on">All</button><button id="fKept">★ Kept</button></span>
      </h2>
      <div id="history"></div>
      <p class="hint" style="margin-top:8px"><button class="ghost" id="clearUnkept" style="padding:2px 6px">Clear unkept</button> Click a thumbnail to restore it.</p>
    </div>
  </div>
</main>

function hexToRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function hsl(hex){

}
function family(hex){
  const {h,s,l}=hsl(hex);
  if(l<.22)return'Black';
  if(l>.86&&s<.45)return'White';
  if(s<.09)return'Gray';
  if(h>=20&&h<75&&s<.24)return'Neutral';
  if(h>=345||h<15)return l>.62?'Pink':'Red';
  if(h<45)return l>.7?'Pink':'Brown';
  if(h<75)return'Yellow';
  if(h<170)return'Green';
  if(h<260)return'Blue';

}

const view=$('view');view.width=W;view.height=H;

let orig=null,masks={};
const R=(x1,y1,x2,y2)=>[[x1,y1],[x2,y1],[x2,y2],[x1,y2]];
const WINDOWS=[R(203,338,266,416),R(408,340,468,414),R(609,336,669,413),R(203,478,267,575),R(611,476,673,572)];
const CASING=R(392,464,486,616), DOORPANEL=R(411,484,469,613);
const WINDOW_GLASS=WINDOWS.map(w=>R(w[0][0]+11,w[0][1]+11,w[2][0]-11,w[2][1]-12));
const DEFS={
  siding:{inc:[R(90,338,780,614),[[822,428],[897,418],[897,545],[822,545]]],
          exc:[...WINDOWS,CASING,R(228,590,316,720),R(560,585,650,690)],
          ok:(r,g,b,l)=>(Math.max(r,g,b)-Math.min(r,g,b))<30&&l>95&&!(g>r+8&&g>b+8)},
  // Trim is built from solid shapes (frames, corner boards, eave band) so shadows don't leave gaps,
  // plus a brightness test only for the thin window bars inside the glass.
  trim:{shade:.45,parts:[
    {inc:[R(75,322,91,570),R(780,322,797,568),R(800,425,822,548),...WINDOWS,CASING],
     exc:[DOORPANEL,R(228,590,316,720),...WINDOW_GLASS],
     ok:(r,g,b,l)=>(Math.max(r,g,b)-Math.min(r,g,b))<48&&l>105&&!(g>r+8&&g>b+8)},
    {inc:[R(76,317,797,340)],exc:[],   // eave band: darker shadow allowed
     ok:(r,g,b,l)=>(Math.max(r,g,b)-Math.min(r,g,b))<48&&l>70&&!(g>r+8&&g>b+8)},
  ]},
  door:{inc:[DOORPANEL],exc:[],ok:(r,g,b)=>r-b>35},

function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();}
function buildMasks(){
  const px=orig.data;
  for(const s of SURFACES){
    const d=DEFS[s.id];
    let f=new Float32Array(W*H);
    for(const part of (d.parts||[d])){
      const oc=document.createElement('canvas');oc.width=W;oc.height=H;
      const c=oc.getContext('2d');
      c.fillStyle='#fff';part.inc.forEach(p=>poly(c,p));
      c.fillStyle='#000';part.exc.forEach(p=>poly(c,p));
      const m=c.getImageData(0,0,W,H).data;
      for(let i=0;i<W*H;i++){
        if(m[i*4]<128)continue;
        const r=px[i*4],g=px[i*4+1],b=px[i*4+2],l=.299*r+.587*g+.114*b;
        if(part.ok(r,g,b,l))f[i]=1;
      }
    }
    for(let pass=0;pass<2;pass++){
      const o=new Float32Array(W*H);
      for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
        o[i]=(f[i-W-1]+f[i-W]+f[i-W+1]+f[i-1]+f[i]+f[i+1]+f[i+W-1]+f[i+W]+f[i+W+1])/9;}
      f=o;
    }
    const idx=[],w=[];
    for(let i=0;i<W*H;i++)if(f[i]>.15){idx.push(i);w.push(Math.min(1,f[i]*1.3));}
    masks[s.id]={idx:Uint32Array.from(idx),w:Float32Array.from(w)};
  }
}
function render(){
  if(!orig)return;
  const out=ctx.createImageData(W,H);out.data.set(orig.data);
  if(!comparing){
    for(const s of SURFACES){
      const col=state[s.id];if(!col)continue;
      const [tr,tg,tb]=hexToRgb(col),{idx,w}=masks[s.id],o=out.data,p=orig.data;
      for(let k=0;k<idx.length;k++){
        const i=idx[k]*4,a=w[k],l=(.299*p[i]+.587*p[i+1]+.114*p[i+2])/255,f=1+(l/s.ref-1)*(DEFS[s.id].shade||1);
        let r,g,b;
        if(f<=1){r=tr*f;g=tg*f;b=tb*f;}else{const t=Math.min(1,(f-1)*.8);r=tr+(255-tr)*t;g=tg+(255-tg)*t;b=tb+(255-tb)*t;}
        o[i]=p[i]+(r-p[i])*a;o[i+1]=p[i+1]+(g-p[i+1])*a;o[i+2]=p[i+2]+(b-p[i+2])*a;
      }
    }
  }
  ctx.putImageData(out,0,0);
  $('badge').hidden=!comparing;
}

/* ---------- UI: surfaces, summary ---------- */
function drawSurfaces(){
  const box=$('surfaces');box.innerHTML='';
  SURFACES.forEach(s=>{
    const col=state[s.id],b=document.createElement('button');
    b.className='surf'+(s.id===active?' active':'');

}

function drawGrid(){
  const q=$('q').value.trim().toLowerCase(),sort=$('sort').value;
  let items=allItems().filter(i=>fam==='All'||(fam==='Mine'?i.src==='my':i.fam===fam));

  const num=n=>{const m=String(n).match(/\d+/);return m?+m[0]:1e6;};
  items.sort((a,b)=>(a.src!==b.src)?(a.src==='my'?-1:1):
    sort==='name'?a.name.localeCompare(b.name):sort==='num'?num(a.no)-num(b.no):b.L-a.L);

    const w=document.createElement('div');w.className='cw';
    w.innerHTML=`<button class="sw-btn ${cur===it.hex?'sel':''}" title="${esc(it.name)} ${it.no?'No. '+esc(it.no)+' · ':''}${it.hex.toUpperCase()}"><i style="background:${it.hex}"></i><span>${esc(it.name)}<em>${it.no?'No. '+esc(it.no):'Mine'}</em></span></button><button class="rm" title="Remove" aria-label="Remove ${esc(it.name)}">✕</button>`;

const say=(t,bad)=>{const s=$('addStatus');s.textContent=t;s.style.color=bad?'#c0392b':'var(--mute)';};
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function addColor(name,hex){

function parseDirect(s){
  s=s.trim();let m;

  if((m=s.match(/^#?([0-9a-f])([0-9a-f])([0-9a-f])$/i)))return('#'+m[1]+m[1]+m[2]+m[2]+m[3]+m[3]).toLowerCase();

}
function fromUrlText(u){

    const im=new Image();im.crossOrigin='anonymous';const t=setTimeout(()=>res(null),8000);
    im.onload=()=>{clearTimeout(t);try{
      const c=document.createElement('canvas');c.width=40;c.height=40;const x=c.getContext('2d'),s=Math.min(im.width,im.height)*.3;
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,40,40);
      const d=x.getImageData(0,0,40,40).data;let r=0,g=0,b=0;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
      const n=d.length/4;res({hex:toHex(r/n,g/n,b/n),name:''});
    }catch(_){res(null);}};
    im.onerror=()=>{clearTimeout(t);res(null);};im.src=u;
  });
}
async function fromPage(u){
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
    const h=await (await fetch(u,{signal:ctl.signal})).text();
    const m=h.match(/hex[^#0-9a-f<>]{0,40}[<>"'\s:]*#?([0-9a-f]{6})(?![0-9a-f])/i)||h.match(/"hex(?:Code|Value)?"\s*:\s*"#?([0-9a-f]{6})"/i);
    if(!m)return null;
    let name='';const t=h.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)/i)||h.match(/<title[^>]*>([^<]+)/i);
    if(t)name=t[1].split(/\s[|\-–—]\s/)[0].trim().slice(0,40);
    return{hex:'#'+m[1].toLowerCase(),name};
  }catch(_){return null;}
}
async function addFromInput(){
  const raw=$('urlIn').value.trim();if(!raw)return;
  let hex=parseDirect(raw),name=$('nameIn').value.trim();
  if(!hex&&/^https?:\/\//i.test(raw)){
    hex=fromUrlText(raw);
    if(!hex){say('Looking up that link…');
      const p=await fromPage(raw)||await fromImageUrl(raw);
      if(p){hex=p.hex;if(!name)name=p.name;}}
  }
  if(!hex){say("Couldn't read a color from that link. Many paint sites block outside access. Paste the hex code (like #8A9A86) or a direct link to a swatch image instead.",true);return;}
  addColor(name,hex);fam='Mine';drawChips();drawGrid();
  say('Added '+(name||hex.toUpperCase())+'. Find it under Mine.');
  $('urlIn').value='';$('nameIn').value='';
}
$('addBtn').onclick=addFromInput;
['urlIn','nameIn'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')addFromInput();}));
$('addCur').onclick=()=>{addColor($('nameIn').value.trim(),$('picker').value);fam='Mine';drawChips();drawGrid();say('Added '+$('picker').value.toUpperCase()+'. Find it under Mine.');$('nameIn').value='';};
$('picker').addEventListener('input',()=>{setColor($('picker').value.toLowerCase());});
$('restorePal').onclick=()=>{pstore.hidden=[];savePal();drawGrid();say('Removed colors restored.');};

const drop=$('drop'),file=$('file'),cc=$('chipCanvas'),cctx=cc.getContext('2d',{willReadFrequently:true});
function loadChip(f){
  if(!f||!f.type.startsWith('image/'))return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const sc=Math.min(1,600/im.width);cc.width=Math.round(im.width*sc);cc.height=Math.round(im.height*sc);
    cctx.drawImage(im,0,0,cc.width,cc.height);$('chipWrap').style.display='block';URL.revokeObjectURL(url);
    const w=Math.max(4,cc.width>>3),h=Math.max(4,cc.height>>3);pickAt((cc.width-w)/2,(cc.height-h)/2,w,h);};
  im.src=url;
}
function pickAt(x,y,w=5,h=5){
  x=Math.max(0,Math.floor(x));y=Math.max(0,Math.floor(y));
  const d=cctx.getImageData(x,y,Math.min(w,cc.width-x),Math.min(h,cc.height-y)).data;
  let r=0,g=0,b=0;const n=d.length/4;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
  setColor(toHex(r/n,g/n,b/n));
}
cc.addEventListener('click',e=>{const r=cc.getBoundingClientRect();pickAt((e.clientX-r.left)*cc.width/r.width-2,(e.clientY-r.top)*cc.height/r.height-2);});
file.onchange=()=>loadChip(file.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',ev=>loadChip(ev.dataTransfer.files[0]));

/* ---------- toolbar ---------- */
const cmp=$('cmp');
cmp.addEventListener('pointerdown',()=>{comparing=true;render();});
['pointerup','pointerleave','pointercancel'].forEach(e=>cmp.addEventListener(e,()=>{if(comparing){comparing=false;render();}}));
$('dl').onclick=()=>{const a=document.createElement('a');a.download='house-colors.png';a.href=view.toDataURL('image/png');a.click();};

/* ---------- history (saved only on request) ---------- */
const sameState=(a,b)=>SURFACES.every(s=>(a[s.id]||null)===(b[s.id]||null));
function thumb(){const t=document.createElement('canvas');t.width=240;t.height=160;
  t.getContext('2d').drawImage(view,40,230,W-80,(W-80)*160/240,0,0,240,160);return t.toDataURL('image/jpeg',.72);}
function saveLS(){try{localStorage.setItem(LS_HIST,JSON.stringify(history));}catch(_){}}
try{const j=JSON.parse(localStorage.getItem(LS_HIST)||'[]');if(Array.isArray(j))history=j;}catch(_){}
const saveBtn=$('saveHist');
function flash(t){saveBtn.textContent=t;setTimeout(()=>saveBtn.textContent='Save to history',1400);}
saveBtn.onclick=()=>{
  if(!orig)return;
  if(SURFACES.every(s=>!state[s.id])){flash('Pick a color first');return;}
  const ex=history.find(h=>sameState(h.colors,state));
  if(ex){curId=ex.id;drawHistory();flash('Already saved');return;}
  const n=history.reduce((m,h)=>Math.max(m,h.n||0),0)+1;
  const e={id:Date.now()+Math.random().toString(36).slice(2,6),name:'Look '+n,n,colors:{...state},thumb:thumb(),fav:false};
  history.unshift(e);curId=e.id;saveLS();drawHistory();flash('Saved ✓');
};
function applyEntry(e){state={siding:null,trim:null,door:null};SURFACES.forEach(s=>state[s.id]=e.colors[s.id]||null);
  curId=e.id;drawSurfaces();drawGrid();render();drawHistory();}
function drawHistory(){
  const box=$('history');box.innerHTML='';
  const list=history.filter(h=>!filterKept||h.fav);
  if(!list.length){box.innerHTML='<div class="empty">'+(filterKept?'Nothing kept yet. Tap ☆ on a look you like.':'Press “Save to history” to keep a look here.')+'</div>';return;}
  list.forEach(h=>{
    const d=document.createElement('div');d.className='h'+(h.id===curId?' cur':'');
    d.innerHTML=`<img src="${h.thumb}" alt="" title="${esc(SURFACES.map(s=>s.label+': '+nameFor(h.colors[s.id])).join('\n'))}">
      <div class="meta"><input class="nm" value="${esc(h.name)}" aria-label="Name">
      <div class="dots">${SURFACES.map(s=>`<i title="${s.label}: ${esc(nameFor(h.colors[s.id]))}" style="background:${h.colors[s.id]||'repeating-linear-gradient(45deg,#d9d9d9 0 3px,#fff 3px 6px)'}"></i>`).join('')}</div>
      <div class="acts"><button class="star ${h.fav?'on':''}" title="Keep">${h.fav?'★':'☆'}</button><button class="del" title="Remove">✕</button></div></div>`;
    d.querySelector('img').onclick=()=>applyEntry(h);
    d.querySelector('.nm').onchange=ev=>{h.name=ev.target.value||h.name;saveLS();};
    d.querySelector('.star').onclick=()=>{h.fav=!h.fav;saveLS();drawHistory();};
    d.querySelector('.del').onclick=()=>{history=history.filter(x=>x!==h);if(curId===h.id)curId=null;saveLS();drawHistory();};
    box.appendChild(d);
  });
}
$('fAll').onclick=()=>{filterKept=false;$('fAll').classList.add('on');$('fKept').classList.remove('on');drawHistory();};
$('fKept').onclick=()=>{filterKept=true;$('fKept').classList.add('on');$('fAll').classList.remove('on');drawHistory();};
$('clearUnkept').onclick=()=>{
  const n=history.filter(h=>!h.fav).length;if(!n)return;
  if(!$('clearUnkept').dataset.sure){$('clearUnkept').dataset.sure=1;$('clearUnkept').textContent='Click again to remove '+n;
    setTimeout(()=>{delete $('clearUnkept').dataset.sure;$('clearUnkept').textContent='Clear unkept';},3000);return;}
  history=history.filter(h=>h.fav);saveLS();drawHistory();delete $('clearUnkept').dataset.sure;$('clearUnkept').textContent='Clear unkept';
};

/* ---------- init ---------- */
drawSurfaces();drawChips();drawGrid();drawHistory();
const img=new Image();
img.onload=()=>{ctx.drawImage(img,0,0,W,H);orig=ctx.getImageData(0,0,W,H);buildMasks();render();};
img.src=IMG_SRC;
</script>
